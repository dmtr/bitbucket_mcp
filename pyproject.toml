[project]
name = "bitbucket-mcp"
version = "0.2.0"
description = "MCP server for Bitbucket Cloud — code search, repositories, commits, branches, pull requests, and file content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlassian-python-api>=4.0.4",
    "mcp[cli]>=1.9.2",
]

[project.scripts]
bitbucket-mcp = "bitbucket_mcp.__main__:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ipython>=9.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitbucket_mcp"]
